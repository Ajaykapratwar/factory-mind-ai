# FactoryMind AI (Pharma) - AI Copilot Benchmark Suite (§9)
# 60 Evaluation Questions: 10 per category

categories:
  - id: 1
    name: "kpi_lookup"
    target_tool: "get_kpi_summary"
    questions:
      - id: "KPI-01"
        prompt: "What is the overall executive KPI summary for the business?"
        expected_tool: "get_kpi_summary"
      - id: "KPI-02"
        prompt: "Can you provide the executive summary of our overall gross profit and revenue?"
        expected_tool: "get_kpi_summary"
      - id: "KPI-03"
        prompt: "What is our current portfolio gross margin percentage?"
        expected_tool: "get_kpi_summary"
      - id: "KPI-04"
        prompt: "How many batches have passed quality control overall?"
        expected_tool: "get_kpi_summary"
      - id: "KPI-05"
        prompt: "What is the portfolio loss-making SKU share across history?"
        expected_tool: "get_kpi_summary"
      - id: "KPI-06"
        prompt: "What is our overall service level and simulated fill rate?"
        expected_tool: "get_kpi_summary"
      - id: "KPI-07"
        prompt: "Give me an executive dashboard overview of total revenue and QC pass rate."
        expected_tool: "get_kpi_summary"
      - id: "KPI-08"
        prompt: "How many machines and supplier shipments are flagged as high risk?"
        expected_tool: "get_kpi_summary"
      - id: "KPI-09"
        prompt: "Show me the top-level KPIs for manufacturing and financial health."
        expected_tool: "get_kpi_summary"
      - id: "KPI-10"
        prompt: "What are our overall revenue and gross margin metrics?"
        expected_tool: "get_kpi_summary"

